<!DOCTYPE html>
<html>
<head>
    <title>more forms</title>
</head>
<body>
    <form action="#">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"> <br> <br>
            <label for="address">Address Line 1:</label>
            <input type="text" placeholder="Flat Number, House Number, etc." size="40" id="address" name="address">

            <label for="address2">Address Line 2:</label>
            <input type="text" placeholder="Street, Area, etc." size="40" id="address2" name="address2">

            <label for="city">City:</label>
            <input placeholder="Vijaywada" type="text" id="city" name="city">
            <label for="state">State:</label>
            <input placeholder="Andhra Pradesh" type="text" id="state" name="state">
            <label for="pincode">Pincode:</label>
            <input placeholder="520001" type="number" id="pincode" name="pincode">
            <br><br>

            <label>Gender:</label>
            <label><input type="radio" name="gender" value="male">Male</label>
            <label><input type="radio" name="gender" value="female">Female</label>
            <label><input type="radio" name="gender" value="other">Other</label>
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>
            
        </fieldset>
    </form> 
</body>
</html>
