<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <input type="number" id="input">
    <script>

        const buttons = ["Fibonacci", "Factorial", "Is Prime", "Is Armstrong", "Even or Odd"];

        function fibonacci(n) {
            if (n <= 1) return n;
            return fibonacci(n - 1) + fibonacci(n - 2);
        }

        function factorial(n) {
            if (n === 0) return 1;
            return n * factorial(n - 1);
        }

        function evenOrOdd(n) {
            if (n % 2 === 0) return "Even";
            return "Odd";
        }

        function isPrime(n) {
            if (n <= 1) return false;
            for (let i = 2; i < n; i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function isArmstrong(n) {
            const sum = n.toString().split("").reduce((acc, digit) => acc + Math.pow(Number(digit), 3), 0);
            return sum === n;
        }

        const container = document.createElement("div");
        container.classList.add("container");
        
        function getInputValue() {
            return Number(document.getElementById("input").value);
        }

        function showResult(value) {
            container.innerHTML = "";
            const resultElement = document.createElement("div");
            resultElement.textContent = value;
            container.appendChild(resultElement);
        }

        const actions = {
            Fibonacci: () => showResult(fibonacci(getInputValue())),
            Factorial: () => showResult(factorial(getInputValue())),
            "Is Prime": () => showResult(isPrime(getInputValue())),
            "Is Armstrong": () => showResult(isArmstrong(getInputValue())),
            "Even or Odd": () => showResult(evenOrOdd(getInputValue()))
        };

        buttons.forEach(button => {
            const buttonElement = document.createElement("button");
            buttonElement.textContent = button;
            buttonElement.addEventListener("click", () => {
                actions[button]();
            });
            document.body.appendChild(buttonElement);
        });

        
        document.body.appendChild(container);



    </script>
</body>
</html>
