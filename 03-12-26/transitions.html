<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .transitionbox {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: all 0.3s ease;
        }
        .transitionbox:hover {
            width: 200px;
            height: 200px;
            background-color: blue;
            color: #fff;
            transform: rotate(360deg);
        }


    </style>
</head>
<body>
   <div class="transitionbox">
    hello world
   </div>
</body>
</html>
